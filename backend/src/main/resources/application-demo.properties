# Isolated in-memory database for homework demonstration; no local MySQL required.
spring.datasource.url=jdbc:h2:mem:bookstore-demo;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-demo.sql
spring.jpa.show-sql=false
bookstore.query-delay-ms=300
logging.level.org.springframework.web=INFO
