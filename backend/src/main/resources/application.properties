spring.application.name=bookstore

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bookstore?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# OpenAI Function Calling assistant (read secrets from environment variables)
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
# Optional local-only overrides (backend/application-local.properties is gitignored)
spring.config.import=optional:file:./application-local.properties

# Java 21 virtual threads for embedded Tomcat request handling
spring.threads.virtual.enabled=true

# Base64-encoded random key, at least 32 bytes; shared by all backend instances
jwt.secret=${JWT_SECRET:}
jwt.issuer=bookstore
jwt.audience=bookstore-api
jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}

# Enable simulated slow I/O only when demonstrating concurrency
bookstore.query-delay-ms=${BOOK_QUERY_DELAY_MS:0}
